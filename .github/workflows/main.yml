name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Bash syntax check
        run: |
          for f in bin/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      - name: Every bin entry exists and is executable
        run: |
          for f in $(jq -r '.bin[]' composer.json); do
            test -x "$f" || { echo "::error::$f is missing or not executable"; exit 1; }
          done
